name: Verify Encrypt Fix

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 157.245.148.63 >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Check encryption env vars
        run: |
          ssh -i ~/.ssh/id_rsa -o IdentitiesOnly=yes root@157.245.148.63 << 'ENDSSH'
            echo "=== .env file contents ==="
            cat /opt/loading-appsmith/.env
            echo ""
            echo "=== Container env check ==="
            docker exec loading-appsmith sh -c 'echo "ENCRYPTION_PASSWORD length: $(echo $APPSMITH_ENCRYPTION_PASSWORD | wc -c)"'
            docker exec loading-appsmith sh -c 'echo "ENCRYPTION_SALT length: $(echo $APPSMITH_ENCRYPTION_SALT | wc -c)"'
            docker exec loading-appsmith sh -c 'echo "ADMIN_EMAILS: $APPSMITH_ADMIN_EMAILS"'
            echo ""
            echo "=== Recent backend errors ==="
            docker logs --tail 20 loading-appsmith 2>&1 | grep -iE "encryption|salt|exception|error" | tail -5
          ENDSSH
